[project]
name = "megascale-measly"
version = "0.1.0"
description = "Mega-scale thermostability analysis: a worked example of the measly workflow."
requires-python = ">=3.12"
dependencies = [
    "measly>=0.1.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
explore = ["marimo>=0.25", "altair>=5"]
models = [
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megascale_measly"]
